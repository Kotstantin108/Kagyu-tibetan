# nginx vhost for https://tibetan.itjoy.space (static PWA + report-api proxy).
# Installed by server/setup.sh into /etc/nginx/sites-enabled/tibetan.itjoy.space.conf.
#
# Caching policy (the app is a PWA with a service worker, so the entry points
# must never be served stale):
#   fonts/, icons/                       immutable, one year
#   audio/                               one week (pronunciation clips generated on the server)
#   sw.js, config.js, index.html, data/  no-cache (revalidate every time)
#   everything else                      10 minutes

server {
    listen 80;
    listen [::]:80;
    server_name tibetan.itjoy.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tibetan.itjoy.space;

    ssl_certificate     /etc/letsencrypt/live/tibetan.itjoy.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tibetan.itjoy.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/tibetan.itjoy.space;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/tibetan.itjoy.space.access.log;
    error_log  /var/log/nginx/tibetan.itjoy.space.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;

    # report-api (server/report-api), see README
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /audio/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /data/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /config.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
}

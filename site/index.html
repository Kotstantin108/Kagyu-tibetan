<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6e1a28">
<meta name="description" content="Learn Classical Tibetan by assembling sentences from tiles.">

    <a class="brand" href="#/play"><span class="seal" aria-hidden="true">ཨོཾ</span><span class="brand-text"><span class="brand-title" data-i18n="appTitle">Tibetan Tiles</span><span class="brand-sub" data-i18n="appTagline"></span></span></a>

  </div>

    <a href="#/settings" data-route="settings" data-i18n="nav.settings">Settings</a>

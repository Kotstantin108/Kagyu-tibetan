name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate course data
        run: node scripts/validate.mjs
      - name: Run unit tests
        run: node --test "site/src/**/*.test.js"
      - name: Install Playwright
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: node scripts/smoke.mjs

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version
        run: sed -i "s/VERSION: 'dev'/VERSION: '${GITHUB_SHA::7}'/" site/config.js && grep VERSION site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  # What GitHub Pages publishes. "site" = the app with a "we moved" banner
  # (transition period); "redirect" = the one-page redirect to the server
  # (switch planned for 2026-10-27, see README "Server").
  PAGES_SOURCE: site

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the rebuilt site/data back (edits from the editor page change content/ only)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the course data from content/
        run: node scripts/build-content.mjs
      - name: Validate course data
        run: node scripts/validate.mjs
      - name: Run unit tests
        run: npm test
      - name: Install Playwright
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: node scripts/smoke.mjs
      - name: Commit the rebuilt data back
        # A save on the editor page (site/edit.html) commits content/ only; the generated
        # site/data and CONTENT_REVIEW.md are kept in the repository, so put them back in
        # sync here. The push uses GITHUB_TOKEN and therefore starts no new run.
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- site/data CONTENT_REVIEW.md; then echo "site/data is up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data CONTENT_REVIEW.md
          git commit -m "Rebuild the course data after a content edit"
          git push || echo "::warning::could not push the rebuilt data (main moved on?); the next build will redo it"

  deploy-server:
    needs: check
    # switched on with: gh variable set DEPLOY_SERVER --body true
    if: ${{ vars.DEPLOY_SERVER == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: server
      url: https://tibetan.itjoy.space/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the course data from content/
        run: node scripts/build-content.mjs
      - name: Stamp the version
        run: |
          sed -i "s/VERSION: 'dev'/VERSION: '${GITHUB_SHA::7}'/" site/config.js
          grep VERSION site/config.js
      - name: Prepare the deploy key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: rsync site/ to the server
        run: |
          # audio/ is generated on the server (scripts/tools/tts-build.py) and is not in the repository
          rsync -az --delete --exclude=audio/ -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            site/ deploy@itjoy.space:/var/www/tibetan.itjoy.space/
      - name: Check the live site
        run: |
          curl -fsSI https://tibetan.itjoy.space/ | head -1
          curl -fsS https://tibetan.itjoy.space/config.js | grep "VERSION: '${GITHUB_SHA::7}'"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the course data from content/
        run: node scripts/build-content.mjs
      - name: Stamp the version
        run: |
          sed -i "s/VERSION: 'dev'/VERSION: '${GITHUB_SHA::7}'/" site/config.js
          grep VERSION site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_SOURCE }}
      - id: deployment
        uses: actions/deploy-pages@v4
